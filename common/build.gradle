plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'com.gradleup.shadow'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name "IzzelAliz Maven"
        url "https://maven.izzel.io/releases/"
    }
    maven {
        name "ParchmentMC"
        url "https://maven.parchmentmc.org/"
    }
    maven {
        name "JitPack"
        url 'https://jitpack.io'
    }
    flatDir {
        dir rootProject.file('libs')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"

    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.neoforged:mergetool:2.0.0"

    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"

    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:$rootProject.forge_config_api_port_version"

    api "dev.icyllis:modernui-core:$rootProject.modernui_version"
    api "icyllis.modernui:ModernUI-Markflow:$rootProject.modernui_version"

    implementation "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    implementation "org.jflac:jflac-codec:$rootProject.jflac_version"

//    implementation "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"

    compileOnly "icyllis.modernui:ModernUI-NeoForge:26.1.2-${rootProject.modernui_version}.+"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
}

processResources {
    inputs.property("version", rootProject.version)
    filteringCharset "UTF-8"

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(sourceSets.main.resources.srcDirs) {
        exclude "META-INF/mods.toml"
        exclude "fabric.mod.json"
    }
}

loom {
    runs {}
}

tasks.named('runClient') { enabled = false }
tasks.named('runServer') { enabled = false }

test {
    useJUnitPlatform()
    enabled = false
}

shadowJar {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}