architectury {
    common rootProject.architectury_enabled_platforms.split(',')
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

processResources {
    inputs.property("version", rootProject.version)
    filteringCharset "UTF-8"

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(sourceSets.main.resources.srcDirs) {
        exclude "META-INF/mods.toml"
        exclude "fabric.mod.json"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // Use Neoforge to avoid "Type net/neoforged/api/distmarker/Dist not present"
    modImplementation "net.neoforged:mergetool:2.0.0"

    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:$rootProject.forge_config_api_port_version"

    implementation "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    implementation "org.jflac:jflac-codec:$rootProject.jflac_version"
    compileOnly "icyllis.modernui:ModernUI-NeoForge:1.21.8-${rootProject.modernui_version}.+"

//    runtimeOnly "dev.icyllis:arc3d-engine:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-compiler:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-core:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-sketch:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-engine:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-granite:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-opengl:2026.2.0"
//    runtimeOnly "dev.icyllis:arc3d-vulkan:2026.2.0"
}

test {
    useJUnitPlatform()
    enabled = false
}

shadowJar {
    enabled = false
}