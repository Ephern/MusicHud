plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    coreLib {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common, coreLib
    runtimeClasspath.extendsFrom common, coreLib
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    coreLib(project(path: ':core')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
    shadowBundle(project(path: ':core')) { transitive = false }

    // Forge Config Api Port for Fabric
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.forge_config_api_port_version"

    modApi("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    // ModernUI Fabric (replaced by fork JAR in run/client/mods/)
    compileOnly("icyllis.modernui:ModernUI-Fabric:1.21.8-${rootProject.modernui_version}.+")
    // modImplementation("icyllis.modernui:ModernUI-Fabric:1.21.8-${rootProject.modernui_version}.+")

    implementation "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    shadowBundle "com.github.umjammer:jlayer:$rootProject.jlayer_version"

    implementation "org.jflac:jflac-codec:$rootProject.jflac_version"
    shadowBundle "org.jflac:jflac-codec:$rootProject.jflac_version"

//    implementation "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
//    shadowBundle "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'org/slf4j/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

loom {
    runs {
        client {
            setRunDirectory file("run/client")
            jvmArguments.addAll(
                    "-Dmusichud.log.level=DEBUG",
                    "-Dfabric.dli.config=${rootProject.rootDir}/.gradle/loom-cache/projects/${project.name}/launch.cfg"
            )
        }
        server {
            setRunDirectory file("run/server")
            jvmArguments.addAll(
                    "-Dmusichud.log.level=DEBUG",
                    "-Dfabric.dli.config=${rootProject.rootDir}/.gradle/loom-cache/projects/${project.name}/launch.cfg"
            )
        }
    }
}