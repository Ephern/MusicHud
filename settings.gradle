pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // NeoForm/FML toolchain POMs (earlydisplay, loader, ...) are parsed against these
        // repositories and import org.lwjgl:lwjgl-bom, which Central does not serve reliably.
        maven { url 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'music_hud.' + properties.get("minecraft_version_range")

include 'processor'
include 'core'
include 'common'
include 'fabric'
include 'neoforge'