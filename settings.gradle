pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'music_hud'

def active = providers.gradleProperty('activePlatform').getOrElse('all')
def profiles = active.split(',').collect { it.trim().toLowerCase() } as Set

include 'core'
include 'common'

if (profiles.contains('all') || profiles.contains('fabric')) {
    include 'fabric'
}
if (profiles.contains('all') || profiles.contains('neoforge')) {
    include 'neoforge'
}
