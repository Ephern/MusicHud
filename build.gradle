plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version + "+" + rootProject.minecraft_version_range
}

// Inject the repository-root third-party license notices into every distributable jar.
// Kept at the root and matched by task name (instead of module path) so the same block
// also works on branches with a different module layout, e.g. without a client `common`.
subprojects {
    tasks.matching { it.name == 'shadowJar' }.configureEach {
        from(rootProject.file('THIRD-PARTY-NOTICES.txt')) {
            into 'META-INF'
        }
        from(rootProject.file('licenses')) {
            into 'META-INF/licenses'
        }
    }
}
