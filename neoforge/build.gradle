plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    coreLib {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common, coreLib
    runtimeClasspath.extendsFrom common, coreLib
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    coreLib(project(path: ':core')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
    shadowBundle(project(path: ':core')) { transitive = false }

    // Same jar the dev run loads; keeping it on the runtime classpath is what lets Architectury
    // Transformer resolve ModernUI classes while transforming.
    modImplementation files(modernUiLumenJar('NeoForge'))
    implementation files(modernUiLumenLibraries('NeoForge'))

    implementation "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    shadowBundle "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    forgeRuntimeLibrary "com.github.umjammer:jlayer:$rootProject.jlayer_version"

    implementation "org.jflac:jflac-codec:$rootProject.jflac_version"
    shadowBundle "org.jflac:jflac-codec:$rootProject.jflac_version"
    forgeRuntimeLibrary "org.jflac:jflac-codec:$rootProject.jflac_version"

    implementation "net.jthink:jaudiotagger:$rootProject.jaudiotagger_version"
    shadowBundle "net.jthink:jaudiotagger:$rootProject.jaudiotagger_version"
    forgeRuntimeLibrary "net.jthink:jaudiotagger:$rootProject.jaudiotagger_version"

//    implementation "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
//    shadowBundle "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
//    forgeRuntimeLibrary "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    forgeRuntimeLibrary "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"

    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    forgeRuntimeLibrary "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
}
processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'org/slf4j/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

loom {
    // NeoForge's dev launch isolates mod class loading in a module layer that only contains
    // MOD_CLASSES groups and mod files, so `:core` must be part of the `main` mod group instead of
    // being a plain classpath/forgeRuntimeLibrary entry. Bundling it into the mod group keeps it in
    // the GAME layer next to `common`/`neoforge` classes, which `Environment.Platform.load` reflects into.
    mods {
        main {
            sourceSet(project.sourceSets.main)
            // Use the compiled classes directory (instead of the core jar) so IDEA/Gradle builds are
            // picked up without having to rebuild `:core:jar` before every debug session.
            modFiles.from(project(':core').sourceSets.main.output)
        }
    }
    runs {
        client {
            setRunDirectory file("run/client")
            jvmArguments.addAll(
                "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
                    "-Dmusichud.log.level=DEBUG"
            )
        }
        server {
            setRunDirectory file("run/server")
            jvmArguments.addAll(
                "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
                    "-Dmusichud.log.level=DEBUG"
            )
        }
    }
}