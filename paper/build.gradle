plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

configurations {
    core {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom core
    runtimeClasspath.extendsFrom core
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${rootProject.minecraft_version}-R0.1-SNAPSHOT"

    core(project(path: ':core'))
    shadowBundle(project(path: ':core')) { transitive = false }

    compileOnly "io.netty:netty-buffer:4.1.118.Final"
    compileOnly "io.netty:netty-codec:4.1.118.Final"

    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property('version', project.version)
    inputs.property('apiVersion', rootProject.minecraft_api_version)
    filesMatching('paper-plugin.yml') {
        expand(
                version: project.version,
                apiVersion: rootProject.minecraft_api_version
        )
    }
    filesMatching('plugin.yml') {
        expand(
                version: project.version,
                apiVersion: rootProject.minecraft_api_version
        )
    }
}

tasks.shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

tasks.assemble {
    dependsOn tasks.shadowJar
}

tasks.runServer {
    minecraftVersion("${rootProject.minecraft_version}")
}

// ---------------------------------------------------------------------------
// Local dev network: 3 Paper servers behind the Velocity proxy
// (see velocity/build.gradle). MusicHud runs on the proxy only - the proxy
// intercepts all MusicHud plugin messages, so backend servers stay vanilla.
// ---------------------------------------------------------------------------

def devForwardingSecret = 'musichud-dev-secret'
def serverRuns = [
        Lobby   : [port: 25565],
        Survival: [port: 25566],
        Creative: [port: 25567],
]

tasks.register('prepareRunConfigs') {
    group = 'run'
    description = 'Generates eula/server.properties/paper-global.yml for all dev servers (existing files are kept)'
    doLast {
        serverRuns.each { name, cfg ->
            def runDir = layout.projectDirectory.dir("runs/${name.toLowerCase()}").asFile
            runDir.mkdirs()
            def eula = new File(runDir, 'eula.txt')
            if (!eula.exists()) {
                eula.text = 'eula=true\n'
            }
            def props = new File(runDir, 'server.properties')
            if (!props.exists()) {
                props.text = """server-port=${cfg.port}
online-mode=false
enforce-secure-profile=false
"""
            }
            def globalConfig = new File(runDir, 'config/paper-global.yml')
            if (!globalConfig.exists()) {
                globalConfig.parentFile.mkdirs()
                // Minimal fragment; Paper merges missing defaults on first start
                globalConfig.text = """proxies:
  velocity:
    enabled: true
    online-mode: false
    secret: '${devForwardingSecret}'
"""
            }
        }
    }
}

serverRuns.each { name, cfg ->
    tasks.register("runServer${name}", xyz.jpenilla.runpaper.task.RunServer) {
        group = 'run'
        description = "Runs a Paper ${rootProject.minecraft_version} backend (${name.toLowerCase()}, port ${cfg.port})"
        dependsOn tasks.named('prepareRunConfigs')
        minecraftVersion("${rootProject.minecraft_version}")
        runDirectory(layout.projectDirectory.dir("runs/${name.toLowerCase()}").asFile)
    }
}

tasks.register('runNetwork') {
    group = 'run'
    description = 'Runs the full dev network: Velocity proxy + 3 Paper servers'
    dependsOn ':velocity:runVelocity', 'runServerLobby', 'runServerSurvival', 'runServerCreative'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
